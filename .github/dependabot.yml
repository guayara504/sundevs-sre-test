version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    target-branch: develop

  - package-ecosystem: terraform
    directories: ["/infra", "/bootstrap"]
    schedule:
      interval: weekly
    target-branch: develop
